name: Sync Google Maps list
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/sync.yml", "scripts/sync.py"]
permissions:
  contents: write
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/sync.py
      - run: |
          git config user.name "london-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/places.json
          git commit -m "sync: places" || echo "no changes"
          git pull --rebase -q && git push
